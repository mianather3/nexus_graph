[package]
name = "nexus_graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Hybrid vector-knowledge graph retrieval engine with deterministic path verification"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "nexus_graph"
path = "src/lib.rs"

[[bin]]
name = "nexus_graph"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bincode = "1.3"
parking_lot = "0.12"
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Production paths must surface failures as `Result`s, never panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Pedantic lints that add noise without improving this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
