[package]
name = "nexus_graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Hybrid vector-knowledge graph retrieval engine with deterministic path verification"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "nexus_graph"
path = "src/lib.rs"

[[bin]]
name = "nexus_graph"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8.9"
bincode = "1.3"
parking_lot = "0.12"
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: scores must survive a JSON roundtrip bit-for-bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
# Denied crate-wide; `src/vector/simd.rs` is the single audited exception.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Production paths must surface failures as `Result`s, never panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
# Pedantic lints that add noise without improving this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
